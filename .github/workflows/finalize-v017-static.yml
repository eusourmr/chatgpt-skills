name: Finalize CS Navigator v0.17.0 static evidence

on:
  push:
    branches:
      - next/v0.17.0-learning-academic
    paths:
      - '.github/workflows/finalize-v017-static.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: next/v0.17.0-learning-academic
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Regenerate 0.17 Navigator snapshots
        run: node scripts/generate-navigator-snapshot.mjs

      - name: Commit exact 0.17 snapshot bytes
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             skills/featured/cs-navigator/references/catalog-snapshot.json             plugins/cs-navigator/skills/cs-navigator/references/catalog-snapshot.json
          if git diff --cached --quiet; then
            SNAP_SHA="$(git rev-parse HEAD)"
          else
            git commit -m "build(0.17): refresh Navigator release snapshots"
            SNAP_SHA="$(git rev-parse HEAD)"
            git push origin HEAD:next/v0.17.0-learning-academic
          fi
          echo "sha=$SNAP_SHA" >> "$GITHUB_OUTPUT"

      - name: Bind static trust review to snapshot bytes
        env:
          SNAP_SHA: ${{ steps.snapshot.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('trust/passport-policy.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          o=data['skill_overrides']['cs-navigator']
          o['reviewed_source_revision']=os.environ['SNAP_SHA']
          o['reviewed_at']='2026-10-11'
          o['stale_after_days']=90
          p.write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          PY
          node scripts/generate-trust-passports.mjs --write
          node scripts/security-gate-v2.mjs --write
          node scripts/generate-risk-labels.mjs --write
          node scripts/generate-trust-passports.mjs --write
          node scripts/update-drift-status.mjs --write --as-of 2026-10-11

      - name: Verify 0.17 evidence boundary
        run: |
          node scripts/generate-trust-passports.mjs --check
          node scripts/validate-trust-passports.mjs --verify-git-source
          node scripts/security-gate-v2.mjs --check
          node scripts/generate-risk-labels.mjs --check
          node scripts/update-drift-status.mjs --check --as-of 2026-10-11
          node scripts/generate-navigator-snapshot.mjs --check
          python - <<'PY'
          import json
          p=json.load(open('trust/passports/cs-navigator.json',encoding='utf-8'))
          assert p['execution']['evidence_state']=='designed'
          assert p['behavior_evidence']['state']=='designed'
          print('0.17 static evidence PASS; changed behavior remains designed.')
          PY

      - name: Commit refreshed static trust
        shell: bash
        run: |
          set -euo pipefail
          git add trust/passport-policy.json trust/passports trust/security-reports trust/risk-labels trust/upstream
          if git diff --cached --quiet; then
            echo "Trust evidence already current."
          else
            git commit -m "trust(0.17): bind release static evidence"
            git push origin HEAD:next/v0.17.0-learning-academic
          fi
