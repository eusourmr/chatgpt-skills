name: Generate v0.7 Trust Passports

on:
  push:
    branches:
      - v0.7.0/verifiable-trust-i
    paths:
      - '.github/workflows/generate-passports-v070.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/generate-passports-v070.yml'
      - 'trust/passport-policy.json'
      - 'scripts/passport-lib.mjs'
      - 'scripts/generate-trust-passports.mjs'
      - 'scripts/validate-trust-passports.mjs'
      - 'installer/manifest.json'
      - 'trust/skills.json'
      - 'trust/execution.json'
      - 'trust/in-product-tests.json'
      - 'trust/in-product-runs.json'
      - 'skills/**'
      - 'trust/passports/**'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out with source history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && 'v0.7.0/verifiable-trust-i' || github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Generate and validate Trust Passports
        run: |
          node scripts/generate-trust-passports.mjs --write
          node scripts/generate-trust-passports.mjs --check
          node scripts/validate-trust-passports.mjs --verify-git-source

      - name: Upload generated Passports
        uses: actions/upload-artifact@v4
        with:
          name: v070-trust-passports
          path: trust/passports
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated Passports on release branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- trust/passports)" ]; then
            echo 'Trust Passports already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trust/passports
          git commit -m 'Generate v0.7 Trust Passports'
          git push origin HEAD:v0.7.0/verifiable-trust-i
