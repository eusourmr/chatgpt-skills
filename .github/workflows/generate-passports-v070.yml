name: Generate v0.7 Trust Passports

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/generate-passports-v070.yml'
      - 'trust/passport-policy.json'
      - 'scripts/passport-lib.mjs'
      - 'scripts/generate-trust-passports.mjs'
      - 'scripts/validate-trust-passports.mjs'
      - 'installer/manifest.json'
      - 'trust/skills.json'
      - 'trust/execution.json'
      - 'trust/in-product-tests.json'
      - 'trust/in-product-runs.json'
      - 'skills/**'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR with source history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Generate and validate Trust Passports
        run: |
          node scripts/generate-trust-passports.mjs --write
          node scripts/generate-trust-passports.mjs --check
          node scripts/validate-trust-passports.mjs --verify-git-source

      - name: Upload generated Passports
        uses: actions/upload-artifact@v4
        with:
          name: v070-trust-passports
          path: trust/passports
          if-no-files-found: error
          retention-days: 7
