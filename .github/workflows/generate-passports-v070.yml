name: Generate v0.7 Trust Passports

on:
  push:
    branches:
      - v0.7.0/verifiable-trust-i
    paths:
      - '.github/workflows/generate-passports-v070.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch with source history
        uses: actions/checkout@v6
        with:
          ref: v0.7.0/verifiable-trust-i
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Generate and validate Trust Passports
        run: |
          node scripts/generate-trust-passports.mjs --write
          node scripts/generate-trust-passports.mjs --check
          node scripts/validate-trust-passports.mjs --verify-git-source

      - name: Commit generated Passports
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- trust/passports; then
            echo 'Trust Passports already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trust/passports
          git commit -m 'Generate v0.7 Trust Passports'
          git push origin HEAD:v0.7.0/verifiable-trust-i
