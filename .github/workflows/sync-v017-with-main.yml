name: Sync CS Navigator v0.17.0 with main

on:
  push:
    branches:
      - next/v0.17.0-learning-academic
    paths:
      - '.github/workflows/sync-v017-with-main.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: next/v0.17.0-learning-academic
          fetch-depth: 0

      - name: Merge current main while preserving 0.17 release state on conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge -X ours origin/main -m "merge: synchronize main into CS Navigator 0.17.0 release"
          git push origin HEAD:next/v0.17.0-learning-academic
