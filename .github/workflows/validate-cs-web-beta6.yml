name: Validate CS Navigator Web Labs beta.6
on:
  pull_request:
    paths:
      - "scripts/build-cs-web-labs-beta6.py"
      - "tests/test_cs_web_labs_beta6.py"
      - ".github/workflows/validate-cs-web-beta6.yml"
      - "docs/CS_WEB_BETA6_NATURAL_USE_2026-11-22.md"
      - "ROADMAP.md"
  push:
    branches: [main]
    paths:
      - "scripts/build-cs-web-labs-beta6.py"
      - "tests/test_cs_web_labs_beta6.py"
      - ".github/workflows/validate-cs-web-beta6.yml"
      - "docs/CS_WEB_BETA6_NATURAL_USE_2026-11-22.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-regress:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit checks for beta.6 natural use
        run: python -m unittest discover -s tests -p 'test_cs_web_labs_beta6.py' -v
      - name: Regression of PC-01 prompt contract
        run: node --test tests/test_prompt_contract.mjs
      - name: Build beta.6 with checksum
        run: python scripts/build-cs-web-labs-beta6.py
      - name: Verify archive
        run: |
          unzip -t dist/cs-navigator-web-labs-0.20.0-beta.6.zip
          (cd dist && sha256sum -c cs-navigator-web-labs-0.20.0-beta.6.zip.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: cs-navigator-web-labs-0.20.0-beta.6-candidate
          path: |
            dist/cs-navigator-web-labs-0.20.0-beta.6.zip
            dist/cs-navigator-web-labs-0.20.0-beta.6.zip.sha256
          if-no-files-found: error
