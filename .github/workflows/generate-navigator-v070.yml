name: Generate CS Navigator 0.7 snapshot

on:
  push:
    branches:
      - v0.7.0/security-drift
    paths:
      - '.github/workflows/generate-navigator-v070.yml'
      - 'scripts/generate-navigator-snapshot.mjs'
      - 'scripts/validate-navigator.mjs'
      - 'trust/passports/**'
      - 'trust/risk-labels/**'
      - 'trust/upstream/**'
      - 'trust/skills.json'
      - 'trust/execution.json'
      - 'sources/external/**'
      - 'tests/fixtures/navigator-*.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/generate-navigator-v070.yml'
      - 'scripts/generate-navigator-snapshot.mjs'
      - 'scripts/validate-navigator.mjs'
      - 'trust/passports/**'
      - 'trust/risk-labels/**'
      - 'trust/upstream/**'
      - 'trust/skills.json'
      - 'trust/execution.json'
      - 'sources/external/**'
      - 'tests/fixtures/navigator-*.json'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && 'v0.7.0/security-drift' || github.event.pull_request.head.sha }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Generate and validate snapshot
        run: |
          node scripts/generate-navigator-snapshot.mjs
          node scripts/generate-navigator-snapshot.mjs --check
          node scripts/validate-navigator.mjs

      - name: Commit snapshot on v0.7 branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- skills/featured/cs-navigator/references/catalog-snapshot.json plugins/cs-navigator/skills/cs-navigator/references/catalog-snapshot.json)" ]; then
            echo 'Navigator snapshots already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skills/featured/cs-navigator/references/catalog-snapshot.json plugins/cs-navigator/skills/cs-navigator/references/catalog-snapshot.json
          git commit -m 'Generate CS Navigator 0.7 trust-aware snapshot'
          git push origin HEAD:v0.7.0/security-drift
