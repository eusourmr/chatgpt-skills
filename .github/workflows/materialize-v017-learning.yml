name: Materialize CS Navigator v0.17.0 learning registry

on:
  push:
    branches:
      - next/v0.17.0-learning-academic
    paths:
      - '.github/workflows/materialize-v017-learning.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: next/v0.17.0-learning-academic
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Register 0.17 capabilities
        run: |
          node scripts/build-v017-learning-academic.mjs
          python scripts/catalog.py --write
          python scripts/validate_catalog.py --write-progress
          node scripts/validate-execution-model.mjs
          node scripts/validate-skill-profiles.mjs
          node scripts/validate-skill-containers.mjs

      - name: Persist generated registry state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             catalog/skills.json             catalog.json             registry/public-capabilities-v1.json             trust/execution.json             trust/skills.json             README.md README.pt-BR.md PROGRESS.md
          if git diff --cached --quiet; then
            echo "0.17 generated state already current."
          else
            git commit -m "build(0.17): materialize learning and academic registry"
            git pull --rebase origin next/v0.17.0-learning-academic
            git push origin HEAD:next/v0.17.0-learning-academic
          fi
