name: Refresh CS Navigator v0.16.0 snapshot

on:
  push:
    branches:
      - release/v0.16.0-evergreen-core
    paths:
      - '.github/workflows/refresh-v016-snapshot.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v0.16.0-evergreen-core
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Regenerate Navigator snapshots
        run: node scripts/generate-navigator-snapshot.mjs

      - name: Commit exact generated snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             skills/featured/cs-navigator/references/catalog-snapshot.json             plugins/cs-navigator/skills/cs-navigator/references/catalog-snapshot.json
          if git diff --cached --quiet; then
            echo "Snapshots already current."
          else
            git commit -m "build(0.16): refresh Navigator snapshots"
            git pull --rebase origin release/v0.16.0-evergreen-core
            git push origin HEAD:release/v0.16.0-evergreen-core
          fi
