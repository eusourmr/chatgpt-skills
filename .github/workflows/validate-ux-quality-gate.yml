name: Validate UX Quality Gate candidate
on:
  pull_request:
    paths:
      - "experiments/ux-quality-gate/**"
      - ".github/workflows/validate-ux-quality-gate.yml"
      - "trust/qualification/pilots/ux-01-conversational-2026-11-06.json"
      - "docs/CS_UX_01_PILOT_AND_BASELINE_2026-11-06.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-ux-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify scanner syntax
        run: python3 -m py_compile experiments/ux-quality-gate/scripts/ux_static_audit.py
      - name: Test conservative HTML heuristics
        run: python3 -m unittest discover -s experiments/ux-quality-gate/scripts -p 'test_*.py' -v
      - name: Verify sourced design cognition retrieval
        run: |
          python3 experiments/ux-quality-gate/scripts/design_knowledge.py "formulário botão salvar erro feedback" > "$RUNNER_TEMP/design-cognition.json"
          python3 - "$RUNNER_TEMP/design-cognition.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["neural_network_trained"] is False
          assert r["field_ux_validated"] is False
          assert any(v["author"]=="Donald Norman" for v in r["results"])
          assert all(v["source"].startswith("https://") for v in r["results"])
          PY
      - name: Verify UX-01 evidence is bounded, never promoted
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("trust/qualification/pilots/ux-01-conversational-2026-11-06.json")
          a=json.loads(p.read_text(encoding="utf-8"))
          assert a["test_id"]=="ux-01-mobile-event-lodging"
          assert a["review"]["status"]=="pass_for_conversational_design_response"
          assert len(a["review"]["criteria"])==5
          assert all(x["result"].startswith("pass") for x in a["review"]["criteria"])
          assert len(a["user_supplied_answer"]["sha256"])==64
          assert not a["evidence_boundaries"]["field_ux_tested"]
          assert not a["evidence_boundaries"]["wcag_conformity_certified"]
          assert not a["evidence_boundaries"]["plugin_skill_promoted"]
          PY
      - name: Smoke test JSON contract and no certification claim
        run: |
          printf '%s\n' '<html lang="pt-BR"><head><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><main><button>Salvar</button></main></body></html>' > "$RUNNER_TEMP/ux-sample.html"
          python3 experiments/ux-quality-gate/scripts/ux_static_audit.py "$RUNNER_TEMP/ux-sample.html" > "$RUNNER_TEMP/ux-result.json"
          python3 - "$RUNNER_TEMP/ux-result.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          assert data["assessment"] == "static_heuristics_only"
          assert data["wcag_conformance_certified"] is False
          assert data["runtime_ux_verified"] is False
          assert data["findings"] == []
          PY
