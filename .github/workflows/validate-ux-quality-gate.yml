name: Validate UX Quality Gate candidate
on:
  pull_request:
    paths:
      - "experiments/ux-quality-gate/**"
      - ".github/workflows/validate-ux-quality-gate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-ux-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify scanner syntax
        run: python3 -m py_compile experiments/ux-quality-gate/scripts/ux_static_audit.py
      - name: Test conservative HTML heuristics
        run: python3 -m unittest discover -s experiments/ux-quality-gate/scripts -p 'test_*.py' -v
      - name: Smoke test JSON contract and no certification claim
        run: |
          printf '%s\n' '<html lang="pt-BR"><head><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><main><button>Salvar</button></main></body></html>' > "$RUNNER_TEMP/ux-sample.html"
          python3 experiments/ux-quality-gate/scripts/ux_static_audit.py "$RUNNER_TEMP/ux-sample.html" > "$RUNNER_TEMP/ux-result.json"
          python3 - "$RUNNER_TEMP/ux-result.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          assert data["assessment"] == "static_heuristics_only"
          assert data["wcag_conformance_certified"] is False
          assert data["runtime_ux_verified"] is False
          assert data["findings"] == []
          PY
