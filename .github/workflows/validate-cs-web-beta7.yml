name: Validate CS Navigator Web Labs beta.7
on:
  pull_request:
    paths:
      - "plugins/cs-navigator-web-labs-beta7/**"
      - "scripts/build-cs-web-labs-beta7.py"
      - "tests/test_cs_web_labs_beta7.py"
      - ".github/workflows/validate-cs-web-beta7.yml"
      - "docs/CS_UPSTREAM_UX_UNSLOP_2026-11-23.md"
      - "ROADMAP.md"
  push:
    branches: [main]
    paths:
      - "plugins/cs-navigator-web-labs-beta7/**"
      - "scripts/build-cs-web-labs-beta7.py"
      - "tests/test_cs_web_labs_beta7.py"
      - ".github/workflows/validate-cs-web-beta7.yml"
      - "docs/CS_UPSTREAM_UX_UNSLOP_2026-11-23.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate beta.7 source attribution and unchanged skills
        run: python -m unittest discover -s tests -p 'test_cs_web_labs_beta7.py' -v
      - name: Retest beta.6 and PC-01 baseline
        run: |
          python -m unittest discover -s tests -p 'test_cs_web_labs_beta6.py' -v
          node --test tests/test_prompt_contract.mjs
      - name: Build private plugin ZIP
        run: python scripts/build-cs-web-labs-beta7.py
      - name: Verify ZIP and SHA-256
        run: |
          unzip -t dist/cs-navigator-web-labs-0.20.0-beta.7.zip
          (cd dist && sha256sum -c cs-navigator-web-labs-0.20.0-beta.7.zip.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: cs-navigator-web-labs-0.20.0-beta.7-candidate
          path: |
            dist/cs-navigator-web-labs-0.20.0-beta.7.zip
            dist/cs-navigator-web-labs-0.20.0-beta.7.zip.sha256
          if-no-files-found: error
