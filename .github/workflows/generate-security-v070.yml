name: Generate v0.7 Security Evidence

on:
  push:
    branches:
      - v0.7.0/verifiable-trust-i
    paths:
      - 'scripts/security-gate-v2.mjs'
      - 'scripts/generate-risk-labels.mjs'
      - 'trust/skills.json'
      - 'trust/passport-policy.json'
      - 'installer/manifest.json'
      - '.github/workflows/generate-security-v070.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.7.0/verifiable-trust-i
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Generate structured security reports and risk labels
        run: |
          node scripts/security-gate-v2.mjs --write
          node scripts/generate-risk-labels.mjs --write
      - name: Commit generated evidence when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- trust/security-reports trust/risk-labels; then
            echo 'Security evidence already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trust/security-reports trust/risk-labels
          git commit -m 'Generate Security Gate v2 evidence'
          git push origin HEAD:v0.7.0/verifiable-trust-i
