name: Build CS Navigator v0.16.0 Evergreen Core

on:
  push:
    branches:
      - release/v0.16.0-evergreen-core
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Assemble evergreen core and public registry
        run: node scripts/build-v016-evergreen-core.mjs

      - name: Build registry MCP server
        working-directory: mcp/cs-registry-server
        run: |
          npm install
          npm run build

      - name: Validate Evergreen Core
        run: |
          node scripts/audit-v016-evergreen-core.mjs
          node scripts/validate-skill-profiles.mjs
          node scripts/validate-skill-containers.mjs
          node scripts/eval-container-guardian.mjs --check

      - name: Confirm public package remains blocked until production MCP exists
        shell: bash
        run: |
          set -euo pipefail
          if node scripts/build-public-plugin-submission.mjs > /tmp/v016-package.log 2>&1; then
            echo "ERROR: public package unexpectedly built without production MCP endpoint"
            cat /tmp/v016-package.log
            exit 1
          fi
          cat /tmp/v016-package.log
          grep -q "mcp.json missing" /tmp/v016-package.log
          echo "Expected release blocker PASS: production MCP endpoint still required."

      - name: Persist generated 0.16 state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             plugins/cs-navigator             registry/public-capabilities-v1.json             catalog/skills.json             mcp/cs-registry-server/package-lock.json
          if git diff --cached --quiet; then
            echo "Generated state already current."
          else
            git commit -m "build(0.16): materialize Evergreen Core [skip v016-build]"
            git push origin HEAD:release/v0.16.0-evergreen-core
          fi
