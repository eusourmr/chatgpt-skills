name: Validate catalog

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate editorial catalog and generated README
        run: python scripts/catalog.py --check
      - name: Validate quality catalog and repository health
        run: python scripts/validate_catalog.py
      - name: Verify generated progress panel is current
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_catalog.py --write-progress
          git diff --exit-code -- PROGRESS.md
      - name: Fetch reviewed Trust Passport source revisions
        shell: bash
        run: |
          set -euo pipefail
          for rev in $(python - <<'PY'
          import glob, json
          refs=set()
          for p in glob.glob('trust/passports/*.json'):
              with open(p, encoding='utf-8') as f:
                  refs.add(json.load(f)['provenance']['reviewed_source_revision'])
          print(' '.join(sorted(refs)))
          PY
          ); do
            git cat-file -e "$rev^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$rev"
          done

      - name: Verify Trust Passports against immutable Git source
        run: node scripts/validate-trust-passports.mjs --verify-git-source
      - name: Verify Security Gate v2 evidence and Risk Labels
        run: |
          node scripts/security-gate-v2.mjs --check
          node scripts/generate-risk-labels.mjs --check
      - name: Verify normalized behavior eval evidence
        run: node scripts/export-behavior-evals.mjs --check
      - name: Verify governance and localized trust vocabulary
        run: |
          node scripts/validate-review-log.mjs
          node scripts/validate-trust-i18n.mjs
      - name: Check Node installer syntax
        run: node --check installer/index.js
      - name: Test regenerative gates
        run: python -m unittest discover -s tests
